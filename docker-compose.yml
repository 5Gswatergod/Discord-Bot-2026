x-app-environment: &app-environment
  DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/guildforge?schema=public}
  REDIS_URL: ${CONTAINER_REDIS_URL:-redis://redis:6379}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guildforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guildforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.1
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-local-development-password}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      _JAVA_OPTIONS: -Xms128m -Xmx${LAVALINK_MAX_HEAP_MB:-384}m
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - "2333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2333'"]
      interval: 10s
      timeout: 5s
      retries: 20

  bot:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-local-development-password}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm dev:bot"
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lavalink:
        condition: service_healthy

  dashboard:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm dev:dashboard"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  pnpm-store:

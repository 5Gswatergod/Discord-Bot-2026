services:
  - type: web
    name: guildforge-dashboard
    runtime: node
    region: singapore
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm db:generate && corepack pnpm --filter @guildforge/dashboard build
    preDeployCommand: corepack pnpm db:push
    startCommand: corepack pnpm --filter @guildforge/dashboard start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: guildforge-shared
      - key: DATABASE_URL
        fromDatabase:
          name: guildforge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: guildforge-redis
          property: connectionString

  - type: worker
    name: guildforge-bot
    runtime: node
    region: singapore
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm db:generate && corepack pnpm --filter @guildforge/bot build
    startCommand: corepack pnpm --filter @guildforge/bot start
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: guildforge-shared
      - key: DATABASE_URL
        fromDatabase:
          name: guildforge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: guildforge-redis
          property: connectionString

  - type: keyvalue
    name: guildforge-redis
    region: singapore
    plan: starter
    ipAllowList: []

databases:
  - name: guildforge-postgres
    region: singapore
    plan: basic-256mb
    databaseName: guildforge
    user: guildforge
    ipAllowList: []

envVarGroups:
  - name: guildforge-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_TEST_GUILD_ID
        value: ""
      - key: DISCORD_BOT_PERMISSIONS
        value: "8"
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: GUILD_SYNC_LIMIT
        value: "100"
      - key: TWITCH_CLIENT_ID
        value: ""
      - key: TWITCH_ACCESS_TOKEN
        value: ""

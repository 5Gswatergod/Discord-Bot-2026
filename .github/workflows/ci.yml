name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guildforge?schema=public
      REDIS_URL: redis://localhost:6379
      DISCORD_CLIENT_ID: build-client-id
      DISCORD_CLIENT_SECRET: dummy-client-secret
      DISCORD_BOT_TOKEN: dummy.bot.token
      NEXTAUTH_SECRET: dummy-nextauth-secret-at-least-16
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      TWITCH_CLIENT_ID: ""
      TWITCH_ACCESS_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: corepack pnpm db:generate

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

  docker-verify:
    name: Docker Verify (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bot
            image: ghcr.io/5gswatergod/discord-bot-2026-bot
            description: GuildForge Discord bot
          - target: dashboard
            image: ghcr.io/5gswatergod/discord-bot-2026-dashboard
            description: GuildForge management dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.image }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }},ignore-error=true

  lavalink-smoke:
    name: Lavalink Plugin Smoke Test
    needs: verify
    runs-on: ubuntu-latest
    env:
      LAVALINK_PASSWORD: ci-lavalink-password
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start Lavalink
        run: docker compose up -d lavalink

      - name: Wait for health and verify plugins
        run: |
          set -euo pipefail
          container_id="$(docker compose ps -q lavalink)"
          for _ in {1..36}; do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$health" == "unhealthy" ]]; then
              docker compose logs lavalink
              exit 1
            fi
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          docker compose logs lavalink | tee /tmp/lavalink.log
          grep -Eiq 'youtube-plugin|youtube source|youtube.*plugin' /tmp/lavalink.log
          grep -Eiq 'lavasrc|lava src' /tmp/lavalink.log

      - name: Lavalink logs
        if: always()
        run: docker compose logs --tail=200 lavalink
